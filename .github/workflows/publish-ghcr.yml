name: Publish verified Decision AP integrated image

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: Shared native staging snapshot (main-YYYYMMDD-shortsha)
        required: true
        type: string
      release_tag:
        description: Existing annotated Git tag on the same commit
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-decision-ap-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and publish multi-architecture image
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./release/publish-ghcr.sh
